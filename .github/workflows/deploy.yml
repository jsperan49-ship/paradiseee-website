name: Publish Paradiseee
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Verify and extract website
        shell: bash
        run: |
          set -euo pipefail
          echo 'aa0f6171835291b8b6218402ef60b6012d6a055935988f11d748b44e627b3c8c  Paradiseee-static-site-only.zip' | sha256sum --check
          mkdir _site
          unzip -q Paradiseee-static-site-only.zip -d _site
          test -f _site/index.html
          test -f _site/pages/contact/index.html
          test -f _site/pages/warranty-policy/index.html
          test -f _site/404.html
          test "$(find _site -type f | wc -l)" -eq 255
          echo '44431173a6bd67500d28ff3aaad579a877261113cad027cced82dea4c34fc6e0  _site/documents/rlx348-manual.pdf' | sha256sum --check
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
